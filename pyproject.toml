[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustworthy-fl"
version = "1.0.0"
description = "Trustworthy federated learning with robust aggregation, RISC Zero verification, and Intel TDX"
requires-python = ">=3.11,<3.14"
dependencies = [
    "flwr[simulation]>=1.30,<2.0",
    "torch>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "streamlit>=1.63.0",
]

[tool.hatch.build.targets.wheel]
packages = ["secure_fl"]

[tool.flwr.app]
publisher = "secure-fl"

[tool.flwr.app.components]
serverapp = "secure_fl.fl.server_app:app"
clientapp = "secure_fl.fl.client_app:app"

[tool.flwr.app.config]

num-server-rounds = 5
local-epochs = 1
batch-size = 256
learning-rate = 0.001
seed = 42

# =============================
# Aggregation
# =============================

# "fedavg" または "median"
aggregation-type = "median"

# Intel TDX上でMedian集約を実行する場合のみtrue
tee-enabled = false

# =============================
# Model Poisoning
# =============================

# trueで攻撃を有効化
attack-enabled = false

# 使用する攻撃手法
attack-type = "sign_flip"

# デフォルトは7クライアント中3クライアントを攻撃者に設定
# 4/7攻撃実験では実行時に "0,1,2,3" を指定する
malicious-client-ids = "0,1,2"

# 1.0:
# Δw → -Δw
#
# 5.0:
# Δw → -5Δw
attack-scale = 1.0

# Adaptive Median Attackを開始するround
attack-start-round = 3

# =============================
# Sampled ZK Verification
# =============================

# 1つの選択パラメータについて、
# local Adam training traceをRISC Zeroで検証するPoC
zk-verification-enabled = false

# 現在のPoCで監視する座標
zk-parameter-name = "net.0.weight"
zk-parameter-row = 0
zk-parameter-col = 0
